[tool.poetry]
name = "menteviva-backend"
version = "0.1.0"
description = "Backend para Mente Viva - Entrenamiento de soft skills con IA"
authors = ["Eric V."]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
# groq >=1.0 es necesario para httpx >=0.28 (que exige google-genai). El SDK
# 0.11 pasaba el kwarg `proxies`, eliminado en httpx 0.28. API estable: sigue
# usando client.chat.completions.create / audio.transcriptions.create.
groq = "^1.0"
elevenlabs = "^1.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.4.0"
python-multipart = "^0.0.12"
websockets = "^13.0"
psycopg = {extras = ["binary", "pool"], version = "^3.2"}
firebase-admin = "^6.0"
# Gemini Live API (audio nativo en tiempo real). Reemplaza el pipeline
# STT+LLM+TTS por una sola sesion bidireccional. Ver docs/plans/05_gemini_live_voice.md
google-genai = "^2.8.0"
openai = "^2.44.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
