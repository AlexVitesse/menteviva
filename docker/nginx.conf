events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=cost_api_per_ip:10m rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

  server {
    listen 8080;
    client_max_body_size 12m;

    location ~ ^/api/(auth/ws-ticket|simli/session-token|avatar/session)$ {
      limit_req zone=cost_api_per_ip burst=10 nodelay;
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/(conversation|chat/voice)/ {
      limit_conn ws_per_ip 3;
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3700s;
    }

    location / {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
